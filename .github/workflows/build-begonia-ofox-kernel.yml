name: Build begonia OrangeFox kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        required: false
        default: 'begonia_user_defconfig'
  push:
    paths:
      - 'drivers/misc/mediatek/flashlight/**'
      - '.github/workflows/build-begonia-ofox-kernel.yml'
      - 'arch/arm64/configs/begonia_user_defconfig'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git lld llvm \
            libssl-dev libelf-dev dwarves python3 zip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Proton clang 15
        run: |
          git clone --depth=1 https://gitlab.com/LeCmnGend/proton-clang.git "$HOME/proton-clang"
          echo "$HOME/proton-clang/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          ARCH: arm64
          SUBARCH: arm64
          DEFCONFIG: ${{ inputs.defconfig || 'begonia_user_defconfig' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/proton-clang/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
          export HOSTCC=clang HOSTCXX=clang++ HOSTAR=llvm-ar HOSTLD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          make O=out "$DEFCONFIG"
          # Make config non-interactive for CI
          scripts/config --file out/.config -d CONFIG_WERROR 2>/dev/null || true
          # MTK/vendor 4.14 tree has warnings-as-errors not suitable for CI toolchain
          scripts/config --file out/.config -d CC_WERROR 2>/dev/null || true

          yes "" | make O=out olddefconfig </dev/null || true
          scripts/config --file out/.config -d LD_DEAD_CODE_DATA_ELIMINATION 2>/dev/null || true
          yes "" | make O=out olddefconfig </dev/null || true
          make -j"$(nproc)" O=out KCFLAGS="-Wno-error -Wno-format -Wno-misleading-indentation -Wno-pointer-compare -Wno-unused-variable -Wno-format-extra-args" 2>&1 | tee build.log
          echo '--- outputs ---'
          find out -path '*arch/arm64/boot/*Image*' -maxdepth 5 | sort
          test -s out/arch/arm64/boot/Image.gz-dtb -o -s out/arch/arm64/boot/Image.gz
          mkdir -p dist
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then cp out/arch/arm64/boot/Image.gz-dtb dist/; fi
          if [ -f out/arch/arm64/boot/Image.gz ]; then cp out/arch/arm64/boot/Image.gz dist/; fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then cp out/arch/arm64/boot/dtbo.img dist/; fi
          if [ -d out/arch/arm64/boot/dts/mediatek ]; then
            mkdir -p dist/dtb
            cp out/arch/arm64/boot/dts/mediatek/*.dtb dist/dtb/ 2>/dev/null || true
            cp out/arch/arm64/boot/dts/mediatek/*.dtbo dist/dtb/ 2>/dev/null || true
          fi
          (cd dist && sha256sum * 2>/dev/null || true) | tee dist/SHA256SUMS.txt
          echo "KVER=$(strings out/vmlinux 2>/dev/null | grep -m1 '^Linux version' || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: begonia-ofox-kernel
          path: dist/*
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
